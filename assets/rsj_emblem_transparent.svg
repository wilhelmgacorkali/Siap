<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="embShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="embLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="embGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Outer Shield Frame -->
  <path d="M50,6 C76,6 92,18 92,44 C92,76 54,96 50,98 C46,96 8,76 8,44 C8,18 24,6 50,6 Z" 
        fill="url(#embShield)" stroke="#38bdf8" stroke-width="2.5" />

  <!-- Inner Trim -->
  <path d="M50,12 C72,12 85,22 85,44 C85,71 52,89 50,91 C48,89 15,71 15,44 C15,22 28,12 50,12 Z" 
        fill="none" stroke="url(#embGold)" stroke-width="1.8" stroke-dasharray="3,2" />

  <!-- Medical Staff -->
  <path d="M50,20 L50,78" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <circle cx="50" cy="18" r="4.5" fill="url(#embGold)" stroke="#ffffff" stroke-width="1.2" />

  <!-- Green Healing Leaves -->
  <path d="M50,48 C32,44 24,30 34,24 C42,32 48,42 50,48 Z" fill="url(#embLeaf)" stroke="#a7f3d0" stroke-width="1.2" />
  <path d="M50,48 C68,44 76,30 66,24 C58,32 52,42 50,48 Z" fill="url(#embLeaf)" stroke="#a7f3d0" stroke-width="1.2" />

  <!-- Lower Leaf Pair -->
  <path d="M50,62 C34,58 28,46 36,40 C44,48 48,56 50,62 Z" fill="#34d399" opacity="0.9" />
  <path d="M50,62 C66,58 72,46 64,40 C56,48 52,56 50,62 Z" fill="#34d399" opacity="0.9" />

  <!-- Golden Serpent -->
  <path d="M42,32 C46,27 56,28 56,34 C56,40 42,42 42,48 C42,55 56,57 56,63 C56,70 46,72 46,75" 
        fill="none" stroke="url(#embGold)" stroke-width="2.6" stroke-linecap="round" />

  <!-- Red Cross Care Symbol -->
  <circle cx="50" cy="50" r="8" fill="#ef4444" />
  <path d="M50,46 L50,54 M46,50 L54,50" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
</svg>
