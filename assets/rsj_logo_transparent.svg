<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Emblem Group (Transparent background) -->
  <g transform="translate(10, 8)">
    <!-- Outer Shield / Riau-inspired Crest Frame -->
    <path d="M52,6 C78,6 94,18 94,44 C94,76 56,96 52,98 C48,96 10,76 10,44 C10,18 26,6 52,6 Z" 
          fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="2.5" opacity="0.95" />

    <!-- Inner Golden Trim Border -->
    <path d="M52,12 C74,12 87,22 87,44 C87,71 54,89 52,91 C50,89 17,71 17,44 C17,22 30,12 52,12 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-dasharray="3,2" />

    <!-- Medical Caduceus Staff -->
    <path d="M52,20 L52,78" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <circle cx="52" cy="18" r="4.5" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="1.2" />

    <!-- Left & Right Healing Green Leaves (Mental Health Symbolism) -->
    <path d="M52,48 C34,44 26,30 36,24 C44,32 50,42 52,48 Z" fill="url(#leafGrad)" stroke="#a7f3d0" stroke-width="1.2" />
    <path d="M52,48 C70,44 78,30 68,24 C60,32 54,42 52,48 Z" fill="url(#leafGrad)" stroke="#a7f3d0" stroke-width="1.2" />
    
    <!-- Lower Leaf Pair -->
    <path d="M52,62 C36,58 30,46 38,40 C46,48 50,56 52,62 Z" fill="#34d399" opacity="0.9" />
    <path d="M52,62 C68,58 74,46 66,40 C58,48 54,56 52,62 Z" fill="#34d399" opacity="0.9" />

    <!-- Golden Serpent of Asclepius wrapping around staff -->
    <path d="M44,32 C48,27 58,28 58,34 C58,40 44,42 44,48 C44,55 58,57 58,63 C58,70 48,72 48,75" 
          fill="none" stroke="url(#goldGrad)" stroke-width="2.6" stroke-linecap="round" />

    <!-- Mental Health Heart / Care Overlay -->
    <circle cx="52" cy="50" r="8" fill="#ef4444" opacity="0.9" />
    <path d="M52,47 L52,53 M49,50 L55,50" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Typography Group (Transparent Background) -->
  <g transform="translate(125, 20)">
    <!-- Header Subtitle / Provinsi -->
    <text x="0" y="16" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="2.5" fill="#38bdf8">
      PEMERINTAH PROVINSI RIAU
    </text>

    <!-- Main Title: RS JIWA TAMPAN -->
    <text x="0" y="44" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="25" font-weight="900" letter-spacing="1.2" fill="#ffffff" filter="url(#subtleGlow)">
      RS JIWA TAMPAN
    </text>

    <!-- Hospital Category: RUMAH SAKIT UMUM DAERAH -->
    <text x="0" y="64" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#e2e8f0">
      RUMAH SAKIT UMUM DAERAH
    </text>

    <!-- Slogan / Motto -->
    <text x="0" y="82" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10.5" font-weight="500" font-style="italic" fill="#94a3b8">
      Melayani dengan Sepenuh Hati &amp; Profesional
    </text>
  </g>
</svg>
